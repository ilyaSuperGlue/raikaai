name: Release APK (arm64-v8a)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 platform + build-tools (+ android-37 shim)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          # Shim: Google has not published the android-37 platform publicly
          # (verified 2026-10-01: not in repository2-1.xml), but the Compose
          # 1.12.0-beta01 / material3 1.5.0-alpha25 / material-kolor 5.0.0
          # artifacts declare compileSdk 37 in their AAR metadata, and AGP 9
          # enforces it. Provide android-37 as android-36's APIs — the app
          # uses no API 37+ calls, so compilation is unaffected.
          cp -r "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/platforms/android-37"
          ls "$ANDROID_HOME/platforms/"

      - name: Install Android NDK r27 (JNI PTY bridge)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK (arm64-v8a)
        env:
          RAIKAAI_KEYSTORE_STORE_PASSWORD: ${{ secrets.RAIKAAI_KEYSTORE_STORE_PASSWORD }}
          RAIKAAI_KEYSTORE_KEY_PASSWORD: ${{ secrets.RAIKAAI_KEYSTORE_KEY_PASSWORD }}
          LITECHAT_KEYSTORE_STORE_PASSWORD: ${{ secrets.LITECHAT_KEYSTORE_STORE_PASSWORD }}
          LITECHAT_KEYSTORE_KEY_PASSWORD: ${{ secrets.LITECHAT_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PabiFilter=arm64-v8a --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release-apks
          TAG="${GITHUB_REF_NAME:-v0.1.1}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-apks/RaikaAI-${TAG}-arm64-v8a.apk"
          ls -lh release-apks/
          cd release-apks
          sha256sum "RaikaAI-${TAG}-arm64-v8a.apk" > checksums-sha256.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raikaai-release-arm64-v8a
          path: release-apks/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
          generate_release_notes: false
